# Um tema do Gravity. Copie para ~/.config/gravity/tema.ini (ou aponte GRAVITY_TEMA para ele)
# e mude o que quiser; o que não estiver aqui fica como o do LUMNA.

[cores]
acento = #f472b6
acento_forte = #db2777
icone = #f9a8d4
